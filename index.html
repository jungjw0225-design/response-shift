<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f0f0f"/>
<title>Response Shift</title>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #c8ff00;
    --accent-dim: rgba(200,255,0,0.12);
    --text: #f0f0f0;
    --text-dim: #888;
    --text-muted: #555;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: break-word;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .header-title span { color: var(--accent); }

  .dots { display: flex; gap: 7px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--surface2); transition: background 0.2s;
  }
  .dot.on { background: var(--accent); }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 32px 24px 24px;
    animation: fadein 0.25s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .step-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .step-ghost {
    font-family: 'Playfair Display', serif;
    font-size: 52px; color: var(--accent-dim);
    line-height: 1; margin-bottom: 14px;
  }
  .q {
    font-size: 27px; font-weight: 500; line-height: 1.45;
    letter-spacing: -0.3px; margin-bottom: 14px;
  }
  .hint { font-size: 14px; color: var(--text-dim); }

  .breath-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    min-height: 200px;
  }
  .breath-circle {
    width: 130px; height: 130px; border-radius: 50%;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    animation: breathe 10s ease-in-out infinite;
  }
  .breath-circle span {
    font-size: 15px; color: var(--accent); font-weight: 500;
  }
  @keyframes breathe {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.32); }
    100% { transform: scale(1); }
  }
  .breath-caption {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
  }
  .card-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .card-text { font-size: 20px; font-weight: 500; line-height: 1.5; }
  .card-text.hero { color: var(--accent); }

  .spacer { flex: 1; }

  .btn {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #000;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 24px;
    flex-shrink: 0;
  }
  .btn:active { transform: scale(0.985); }
  .btn.ghost {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .final {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 12px;
  }
  .final-big {
    font-size: 32px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.4;
  }
  .final-big span { color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Response <span>Shift</span></div>
  <div class="dots">
    <div class="dot on" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
    <div class="dot" id="d4"></div>
  </div>
</div>

<main>

  <section class="screen active" id="s1">
    <div class="step-label">Step 1 · Pause</div>
    <div class="step-ghost">01</div>
    <h1 class="q">내 안에서<br>올라오는 건 뭐지?</h1>
    <div class="breath-wrap">
      <div class="breath-circle"><span>숨</span></div>
      <div class="breath-caption">들이쉬기 4초 · 내쉬기 6초</div>
    </div>
    <button class="btn" onclick="go(2)">다음</button>
  </section>

  <section class="screen" id="s2">
    <div class="step-label">Step 2 · 분리</div>
    <div class="step-ghost">02</div>
    <div class="card">
      <div class="card-label">말</div>
      <div class="card-text">들은 문장, 그대로.</div>
    </div>
    <div class="card">
      <div class="card-label">의도</div>
      <div class="card-text hero">사실, 나는 모르지.</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" onclick="go(3)">다음</button>
  </section>

  <section class="screen" id="s3">
    <div class="step-label">Step 3 · 결과</div>
    <div class="step-ghost">03</div>
    <h1 class="q">내가 원하는<br>결과는?</h1>
    <p class="hint">이기는 것 말고, 얻고 싶은 것.</p>
    <div class="spacer"></div>
    <button class="btn" onclick="go(4)">다음</button>
  </section>

  <section class="screen" id="s4">
    <div class="final">
      <div class="step-label">Ready</div>
      <div class="final-big">반응 말고,<br><span>대응.</span></div>
    </div>
    <button class="btn ghost" onclick="go(1)">처음부터</button>
  </section>

</main>

<script>
  function go(n) {
    for (var i = 1; i <= 4; i++) {
      document.getElementById('s' + i).classList.toggle('active', i === n);
      document.getElementById('d' + i).classList.toggle('on', i <= n);
    }
    if (n === 1) {
      for (var j = 2; j <= 4; j++) document.getElementById('d' + j).classList.remove('on');
    }
    window.scrollTo(0, 0);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

</body>
</html>
